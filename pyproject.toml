[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphlm"
version = "0.6.0"
description = "Generate codebase graphs (Markdown + JSON + interactive HTML) from any project directory using an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Greg Grace", email = "graphlm@519lab.com" }]
keywords = ["codebase", "graph", "llm", "static-analysis", "tree-sitter", "documentation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv",
    "typer",
    "httpx",
    "pydantic>=2.0",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
]

[project.optional-dependencies]
# `graphlm --serve` — the MCP server that lets a coding agent query the map.
# Opt-in so the base install stays lean; the CLI prints an install hint if the
# flag is used without it.
mcp = ["mcp>=2,<3"]
# JS/TS Tree-sitter grammars for deterministic import edges. The resolver lives
# in-tree (`graphlm/parsers/javascript.py`); this extra only pulls the wheels.
# Without it, JS/TS files contribute zero edges and one log line per language, never a crash.
# Python stays in the base install. See ADR-004.
js = [
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]
# Java Tree-sitter grammar. Resolver in `graphlm/parsers/java.py`. Same
# degradation contract as [js]: missing extra → zero Java edges, one log
# line, Python/JS edges intact.
java = ["tree-sitter-java>=0.23,<0.24"]
# Rust Tree-sitter grammar. Resolver in `graphlm/parsers/rust.py`. Same
# degradation contract: missing extra → zero Rust edges, one log line.
rust = ["tree-sitter-rust>=0.24,<0.25"]
# C# Tree-sitter grammar. Resolver in `graphlm/parsers/csharp.py`. Same
# degradation contract: missing extra → zero C# edges, one log line.
csharp = ["tree-sitter-c-sharp>=0.23,<0.24"]
# C and C++ Tree-sitter grammars. Resolver in `graphlm/parsers/cpp.py`.
# Quoted #include only; angle-bracket system headers are dropped.
cpp = [
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
]
# Go Tree-sitter grammar. Resolver in `graphlm/parsers/go.py`.
go = ["tree-sitter-go>=0.23,<0.26"]
# PHP Tree-sitter grammar. Resolver in `graphlm/parsers/php.py`.
# language_php() (not language()) — the wheel also ships php_only.
php = ["tree-sitter-php>=0.23,<0.26"]
# TypeSafe/Jev SDK for prose evidence-scoring (a downstream-trust weight on the
# LLM's summaries). Opt-in — it talks to a commercial third-party API and needs
# a TYPESAFE_API_KEY, so it is never a base dependency. Offered by the first-run
# setup wizard (`graphlm --setup`). Not aggregated by `all` (that is languages
# only; `mcp` is likewise separate). Consumed by `graphlm/evidence.py`.
typesafe = ["typesafe-sdk>=0.7,<0.8"]
# Every language pack. Does not include `mcp` or `typesafe`.
all = ["graphlm[js]", "graphlm[java]", "graphlm[rust]", "graphlm[csharp]", "graphlm[cpp]", "graphlm[go]", "graphlm[php]"]

[project.urls]
Homepage = "https://github.com/ggrace519/graphLM"
Repository = "https://github.com/ggrace519/graphLM"
Changelog = "https://github.com/ggrace519/graphLM/blob/main/CHANGELOG.md"
Issues = "https://github.com/ggrace519/graphLM/issues"

[project.scripts]
graphlm = "graphlm.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-httpx",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude"]

[tool.hatch.build.targets.wheel]
packages = ["graphlm"]

# Release preparation: `uvx bump-my-version bump patch|minor|major`
# Bumps project.version (auto — config lives here), promotes the CHANGELOG's
# [Unreleased] section to a dated release header, and updates the compare links.
# Commit/tag stay disabled so PR CI gates the release commit before a maintainer
# creates and pushes the publishing tag. See CONTRIBUTING.md for the full flow.
# NOTE: keep current_version in step with project.version above.
[tool.bumpversion]
current_version = "0.6.0"
commit = false
tag = false
allow_dirty = false

# CHANGELOG: insert a dated release header below the permanent [Unreleased]
# heading (we keep [Unreleased], we don't rename it).
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {utcnow:%Y-%m-%d}"""

# CHANGELOG: rewrite the Unreleased compare link to the new version AND add the
# new version's own compare link, in one replacement (order-independent).
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/ggrace519/graphLM/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/ggrace519/graphLM/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/ggrace519/graphLM/compare/v{current_version}...v{new_version}"""
