name: Release

# Releases graphlm automatically when a promotion lands on main (ADR-020):
#
#   tag            the shared release workflow reads CHANGELOG.md's top
#                  `## [X.Y.Z] - date` section; if vX.Y.Z has no tag yet it creates
#                  the tag and a GitHub Release whose notes are that section. On the
#                  promotion pull request it only validates (dry run), so a
#                  promotion whose changelog is not ready shows red before the merge.
#   build          builds the tagged commit once and smoke-tests the wheel. It
#                  also runs on the promotion pull request, so a broken wheel is
#                  caught before the merge creates the tag.
#   github-release attaches the artifacts to that release.
#   pypi-publish   publishes the same artifacts via Trusted Publishing (OIDC).
#
# Everything is chained in this one workflow on purpose: a tag created with
# GITHUB_TOKEN starts no other workflow, so a separate `on: push: tags` job would
# never fire. PyPI's trusted publisher is bound to this file name and the `pypi`
# environment; keep both. If a publish step fails after the tag exists, use
# "Re-run failed jobs": the tag job's outputs are kept.
#
# A manual run (workflow_dispatch) skips the tag job and publishes to TestPyPI
# instead, so the Trusted-Publishing path can be rehearsed without burning the
# real name/version. No run re-executes the test matrix: ci.yml gates the commit.
# Assets are uploaded after the tag job creates the release, which requires the
# repository's "immutable releases" setting to stay off (ADR-020).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target for a manual run"
        type: choice
        options:
          - testpypi
          - none
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag & GitHub Release
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write # create the tag and the release
    uses: ggrace519/.github/.github/workflows/release.yml@8217a8363cd8f8222471a39df2a0892e0fec2c00 # v2.0.0
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}

  build:
    name: Build & smoke-test
    needs: tag
    # Also on the promotion pull request, so a wheel that would fail its smoke
    # test is caught before the merge creates a tag and a release that cannot
    # be fixed without a new version.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.tag.result == 'success' &&
         (github.event_name == 'pull_request' || needs.tag.outputs.released == 'true')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag on a release; the pull request's merge commit (what main
          # will become) on the promotion pull request; the branch on a manual run.
          ref: ${{ needs.tag.outputs.released == 'true' && needs.tag.outputs.tag || github.sha }}
          fetch-depth: 0 # the main-ancestry check below needs main's history

      # A release must come from main. The tag job only runs on a push to main,
      # so this holds by construction; keep the check so a future trigger
      # change cannot publish a commit main does not contain.
      - name: Verify the release commit is on main
        if: needs.tag.outputs.released == 'true'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main."
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main."

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: "release"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      # The version comes from CHANGELOG.md's top section (pyproject `dynamic`),
      # the same section the tag job tagged. Fail loudly if they ever disagree.
      # Also on the promotion pull request: the dry run reports the version it
      # would tag.
      - name: Verify the built version matches the tag
        if: needs.tag.outputs.version != ''
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          for f in "dist/graphlm-${VERSION}-py3-none-any.whl" "dist/graphlm-${VERSION}.tar.gz"; do
            [ -f "$f" ] || { echo "::error::expected $f; built: $(ls dist)"; exit 1; }
          done
          echo "dist/ matches v${VERSION}."


      # The check the test suite can't do: install the *built wheel* into a
      # fresh venv (never .venv) and run it. This catches a missing entry point,
      # a missing data file (_html_template.html), or a missing dependency — all
      # at once, with no network (--dry-run makes no LLM call).
      - name: Smoke-test the built wheel in a clean venv
        run: |
          set -euo pipefail
          repo_root="$PWD"
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          # Leave the checkout so its graphlm/ directory cannot shadow the
          # package installed from the wheel.
          cd /tmp
          echo "--- graphlm --version ---"
          /tmp/smoke/bin/graphlm --version
          echo "--- graphlm <fixture> --dry-run ---"
          /tmp/smoke/bin/graphlm "$repo_root/tests/fixtures/small_project" --dry-run
          echo "--- HTML template ships in the wheel ---"
          /tmp/smoke/bin/python -c "import graphlm, importlib.resources as r; \
            p = r.files('graphlm') / '_html_template.html'; \
            assert p.is_file(), 'MISSING _html_template.html'; \
            assert str(p).startswith('/tmp/smoke/'), f'IMPORTED CHECKOUT: {p}'; \
            print('ok:', p)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    name: Attach artifacts to the release
    needs: [tag, build]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload to the release the tag job created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi-publish:
    name: Publish to PyPI
    needs: [tag, build]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphlm
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token secret
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi-publish:
    name: Publish to TestPyPI
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/graphlm
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
