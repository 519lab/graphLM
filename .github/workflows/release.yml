name: Release

# Publishes graphlm to PyPI *and* a GitHub Release from one git tag.
#
# Maintainer procedure: prepare the version on a release branch, merge it only
# after PR/main CI, then create, verify, and push one signed tag. See the
# "Releasing (maintainers)" section in CONTRIBUTING.md for the exact commands.
#
# The tag drives everything: build once, smoke-test the built wheel in a clean
# venv, attach the artifacts to a GitHub Release, and publish the same artifacts
# to PyPI via Trusted Publishing (OIDC — no stored API token).
#
# A manual run (workflow_dispatch) publishes to TestPyPI instead, so the whole
# Trusted-Publishing path can be rehearsed without burning the real name/version.
# This does NOT re-run the test matrix — the push/PR CI (ci.yml) already gates
# the commit on 3-version pytest + mypy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target for a manual run"
        type: choice
        options:
          - testpypi
          - none
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check below needs main's history

      # A release must come from main. Any account with write access can push
      # a v* tag on any commit; this stops the build (and so both publish
      # jobs, which need it) unless the tagged commit is already on main.
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit of origin/main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: "release"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      # The check the test suite can't do: install the *built wheel* into a
      # fresh venv (never .venv) and run it. This catches a missing entry point,
      # a missing data file (_html_template.html), or a missing dependency — all
      # at once, with no network (--dry-run makes no LLM call).
      - name: Smoke-test the built wheel in a clean venv
        run: |
          set -euo pipefail
          repo_root="$PWD"
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          # Leave the checkout so its graphlm/ directory cannot shadow the
          # package installed from the wheel.
          cd /tmp
          echo "--- graphlm --version ---"
          /tmp/smoke/bin/graphlm --version
          echo "--- graphlm <fixture> --dry-run ---"
          /tmp/smoke/bin/graphlm "$repo_root/tests/fixtures/small_project" --dry-run
          echo "--- HTML template ships in the wheel ---"
          /tmp/smoke/bin/python -c "import graphlm, importlib.resources as r; \
            p = r.files('graphlm') / '_html_template.html'; \
            assert p.is_file(), 'MISSING _html_template.html'; \
            assert str(p).startswith('/tmp/smoke/'), f'IMPORTED CHECKOUT: {p}'; \
            print('ok:', p)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            graphlm ${{ github.ref_name }}

            Install: `uv tool install graphlm` or `pipx install graphlm`
            (or grab the wheel/sdist below). See the
            [CHANGELOG](https://github.com/519lab/graphLM/blob/main/CHANGELOG.md)
            for what's in this release.

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphlm
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token secret
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  testpypi-publish:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/graphlm
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
