name: promote

# Opens or refreshes the single develop → main promotion pull request after CI passes on a develop push.
# The logic lives in ggrace519/.github; see its README.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Only push-triggered and manual runs share the group, so a newer one cancels a superseded one.
# A develop merge also fires lint on the open promotion PR (event pull_request). Its promote run
# is skipped by the job's `if`, but concurrency applies before `if`, so in a shared group it would
# cancel the push run that should refresh the PR. Give those runs a group of their own.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
        && 'promote-develop-to-main' || format('promote-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: ggrace519/.github/.github/workflows/promote.yml@a97e5ec9598944c5238ee490e5eb1fea7a3770bd # v1.1.0
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
