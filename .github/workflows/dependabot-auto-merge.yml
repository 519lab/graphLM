name: Dependabot auto-merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Gate on who OPENED the pull request, not github.actor: actor is whoever
    # triggered the latest event (a push or re-run by someone else), which is
    # the pattern GitHub's own guidance warns against.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Python dependency patch/minor updates merge on green CI. GitHub Actions
      # updates do NOT: an action runs with the release job's credentials
      # (including the PyPI Trusted Publishing token), so a new action SHA gets
      # a human review. Both spellings of the ecosystem are excluded because the
      # output echoes the configured value.
      - name: Enable auto-merge for patch and minor (not GitHub Actions)
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          steps.meta.outputs.package-ecosystem != 'github-actions' &&
          steps.meta.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
