name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# No job needs to write anything (no releases, no PR comments, no checks
# API calls) — read-only is the least privilege the checkout + test/typecheck
# steps require. Addresses CodeQL actions/missing-workflow-permissions (#1, #2).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: "test-py${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --extra mcp so the `--serve` MCP-server tests run (they importorskip
      # without it); the missing-extra CLI path is covered by a sys.modules stub.
      - name: Install dependencies
        run: uv sync --group dev --extra mcp

      - name: Run tests with coverage
        run: uv run pytest --cov=graphlm --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Default `test` job above runs without language extras, so the
  # grammar-absent degradation path is what CI exercises on every PR. This
  # job installs every language pack (`graphlm[all]`) plus mcp and runs the
  # enabled-path language-pack tests (they skip without their extra).
  test-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: "test-packs"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (language packs + mcp + typesafe)
        run: uv sync --group dev --extra mcp --extra all --extra typesafe

      - name: Run tests
        # --extra typesafe so tests/test_evidence.py (importorskip typesafe_sdk,
        # fake client — no API key needed) actually runs in CI instead of
        # skipping silently (#188). typesafe-sdk resolves from public PyPI.
        run: uv run pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: "typecheck"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy graphlm --ignore-missing-imports
